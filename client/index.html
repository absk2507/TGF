<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#26275E" />
    <meta name="description" content="TGF ASSOCIATION — a Ganesh Chaturthi community archive from Rampuram." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&display=swap" rel="stylesheet" />
    <link rel="icon" href="/manus-storage/softwarebois-mark_dbac1f76.png" />
    <title>TGF ASSOCIATION — Rampuram</title>
  </head>
  <body>
    <div id="root">
      <main data-tgf-loading-shell style="display:grid;min-height:100vh;place-items:center;background:#fbf4e8;color:#26275e;font-family:Arial,sans-serif;padding:24px;text-align:center">
        <div>
          <strong style="display:block;font-size:20px">Loading TGF ASSOCIATION…</strong>
          <p style="margin:10px 0 0;line-height:1.5">If this message remains, refresh this page once to load the latest site version.</p>
        </div>
      </main>
    </div>
    <script>
      (() => {
        const root = document.getElementById("root");
        const recoveryKey = "tgf-pages-bundle-recovery";
        const loadingShell = () => root?.querySelector("[data-tgf-loading-shell]");

        const observer = new MutationObserver(() => {
          if (!loadingShell()) {
            sessionStorage.removeItem(recoveryKey);
            observer.disconnect();
          }
        });

        if (root) observer.observe(root, { childList: true, subtree: true });

        window.setTimeout(() => {
          if (!loadingShell() || sessionStorage.getItem(recoveryKey)) return;

          sessionStorage.setItem(recoveryKey, "1");
          const refreshedUrl = new URL(window.location.href);
          refreshedUrl.searchParams.set("refresh", Date.now().toString());
          window.location.replace(refreshedUrl.toString());
        }, 3500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
